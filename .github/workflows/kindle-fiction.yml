name: Kindle Fiction MVP
on:
  pull_request:
    paths:
      - 'apps/kindle-fiction/**'
      - '.github/workflows/kindle-fiction.yml'
  push:
    paths:
      - 'apps/kindle-fiction/**'
      - '.github/workflows/kindle-fiction.yml'
jobs:
  epub-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test EPUB builder (no model required)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip unzip
          cd apps/kindle-fiction
          node --test test/*.test.mjs
