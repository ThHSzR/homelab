name: Tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate A30 remote shell scripts
        run: |
          for script in tools/a30-remote/a30-remote tools/a30-remote/a30-adb-gateway tools/a30-remote/*.sh; do bash -n "$script"; done
          shellcheck tools/a30-remote/a30-remote tools/a30-remote/a30-adb-gateway tools/a30-remote/*.sh
          bash tools/a30-remote/test-install.sh
      - run: npm ci
      - run: npm test
